<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6f4e37" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOCA" />
    <meta name="description" content="MOCA (Marketing On CAfe) — 네이버 카페 자동화. 카페 글쓰기·활동·홍보·관리를 자동으로." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MOCA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      input, textarea, select { -webkit-user-select: text !important; user-select: text !important; }
      body { overflow: hidden; background: #16110d; }
      /* iOS safe area */
      body { padding-top: env(safe-area-inset-top); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(r => console.log('[PWA] SW 등록됨', r.scope))
            .catch(e => console.log('[PWA] SW 실패', e));
        });
      }
    </script>
  </body>
</html>
